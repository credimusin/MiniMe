name: Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-validate:
    name: OpenTofu Format, Validate & TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Setup OpenTofu
        uses: https://github.com/opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.5"
          tofu_wrapper: false

      - name: Setup TFLint
        uses: https://github.com/terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.65.0"

      - name: Run CI checks
        run: ./scripts/ci-check.sh
